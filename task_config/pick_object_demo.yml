save_dir: ./data

decimation: 1

save_frequency: 2
video_frequency: 2
render_frequency: 1  # 0 = headless (livestream), 1 = open IsaacSim window

random_texture: false

use_seed: true
episode_num: 5

sensor_type: gsmini

observations:
  camera: ['rgb']
  tactile: ['rgb', 'rgb_marker', 'marker', 'depth', 'pose']
  embodiment: ['joint', 'ee']
  actor: true
  # language/instruction is always saved regardless of this config
  # (added unconditionally by _get_observations in _base_task.py)
